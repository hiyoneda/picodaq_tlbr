# picodaq configuration. Keys left out take the defaults in src/picodaq/config.py.

scope:
  resolution: 10BIT

channels:
  A: {enabled: true, range: V2}     # anode
  B: {enabled: true, range: V2}     # cathode
  C: {enabled: false, range: V2}
  D: {enabled: false, range: V2}

trigger:
  enabled: true
  source: A
  threshold_mv: 30
  auto_trigger_ms: 0

capture:
  samples: 5000
  sample_rate_hz: 20000000
  pre_trigger_fraction: 0.2
  total_waveforms: null
  loop: poll            # poll: own IsReady loop (Stop / timeout read out a partial batch)
                        # simple: run_simple_rapid_block_capture (old behaviour)
  batch_timeout_s: 2.0  # poll only: read out whatever was captured after this time

output:
  data_dir: data/%Y%m%d    # strftime codes are expanded at run start
  base: tlbr
  start_id: 0
  max_file_size_mb: 1024
  rapid_block_captures: 32
  compression: lzf

# Pulse processing: used by the quick look AND by the offline analysis
# (picodaq.shaping.ChannelProcessor.from_config). Saved in every file.
processing:
  anode: A
  cathode: B
  baseline_fraction: 0.8          # baseline = first 80 % of the pre-trigger samples
  shaper: {rise_us: 15.0, flat_us: 12.0}
  amplitude: flattop              # flattop | max
  guard_frac: 0.15
  flattop_window: null            # e.g. [0.6, 0.9]: average only the late part of the flat top
                                  # (needs a flat top longer than the collection time)
  channels:
    A: {polarity: 1, tau_us: 148.0}    # pole-zero tau tuned in the Cs-137 notebook
    B: {polarity: -1, tau_us: 27.0}

# Quick-look display only
ql:
  waveforms_per_batch: 4
  amp_max_v: 2.0
  amp_bins: 512
  amp2d_bins: 256
  ratio_range: [0.0, 2.0]
  ratio_bins: 200

simulate: false
sim_rate_hz: 600
